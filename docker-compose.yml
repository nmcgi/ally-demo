services:
  db:
    image: postgres:16-alpine
    container_name: ally-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ally
      POSTGRES_PASSWORD: ally_local
      POSTGRES_DB: ally_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ally -d ally_db']
      interval: 10s
      timeout: 5s
      retries: 5

  db-admin:
    image: adminer:latest
    container_name: ally-demo-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
